<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin – Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--panel:#0e1530;--panel2:#141d40;--line:#222d57;--text:#fff;--muted:#9fabd0;--cyan:#37e6ff;--pink:#ff3d9a;--violet:#8a5cff;--ok:#3ddc97;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.6 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.3;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--violet);top:-20vmax;left:-10vmax}
.aurora i:nth-child(2){background:var(--cyan);right:-20vmax;top:30vh;opacity:.2;animation-delay:-6s}
.aurora i:nth-child(3){background:var(--pink);bottom:-25vmax;left:20vw;opacity:.22;animation-delay:-12s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.wrap{width:min(900px,100% - 2rem);margin:0 auto;padding:1.5rem 0 4rem}
h1,h2{margin:0;letter-spacing:-.02em;line-height:1.1}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;background:linear-gradient(100deg,#fff,var(--cyan) 40%,var(--violet) 70%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.25rem;font-weight:800;margin-bottom:.4rem}
p.sub{color:var(--muted);margin:.4rem 0 1.2rem}
.card{background:rgba(14,21,48,.85);border:1px solid var(--line);border-radius:24px;padding:1.5rem;margin-bottom:1.2rem;backdrop-filter:blur(8px)}
.c1{border-top:3px solid var(--cyan)}.c2{border-top:3px solid var(--violet)}.c3{border-top:3px solid var(--pink)}
label{display:grid;gap:.35rem;color:var(--muted);font-size:.93rem;margin-bottom:.95rem}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem;color:var(--text);font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.btn{border:0;border-radius:999px;padding:.85rem 1.6rem;font:800 1rem "Manrope",sans-serif;cursor:pointer;color:#070b1a;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.out{background:none;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:.4rem .9rem;font-size:.88rem}
.btn.del{background:none;border:1px solid var(--pink);color:#ffb3d6}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem}
.top .r{display:flex;gap:.6rem;flex-wrap:wrap}
.row{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.95rem 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{display:block}.row small{color:var(--muted);word-break:break-all}
.badge{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:.05rem .65rem;font-size:.8rem;color:var(--muted);margin-left:.4rem}
.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--ok);color:#04230f;font-weight:800;border-radius:999px;padding:.8rem 1.5rem;transition:transform .35s;z-index:20;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}.toast.err{background:var(--pink);color:#fff}
.vbox{border:1px solid var(--line);background:rgba(20,29,64,.55);border-radius:18px;padding:1.1rem;margin-bottom:1rem}
.vbox:nth-child(3n+1){border-left:3px solid var(--cyan)}.vbox:nth-child(3n+2){border-left:3px solid var(--violet)}.vbox:nth-child(3n){border-left:3px solid var(--pink)}
.vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.tabs{display:flex;gap:.5rem;margin:.8rem 0 1.2rem;position:sticky;top:calc(.5rem + env(safe-area-inset-top,0px));z-index:10;padding:.4rem;background:rgba(14,21,48,.9);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(10px)}
.tab{flex:1;border:0;border-radius:999px;padding:.7rem 1rem;font:800 .98rem "Manrope",sans-serif;cursor:pointer;color:var(--muted);background:none;transition:.2s}
.tab.active{color:#070b1a;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink))}
[hidden]{display:none!important}
#login{text-align:center;margin-top:12vh}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <div id="login" class="card c1">
    <h1>Admin panel</h1>
    <p class="sub">Sign in with your Google account to control your website.</p>
    <button class="btn" id="signin">Sign in with Google</button>
    <p id="lmsg" style="color:#ffb3d6;margin-top:1rem"></p>
  </div>

  <div id="panel" hidden>
    <div class="top">
      <div><h1>Control panel</h1><p class="sub" id="who" style="margin:.3rem 0 0"></p></div>
      <div class="r"><a class="btn out sm" href="index.html" target="_blank" style="text-decoration:none;display:inline-block;line-height:1.9">View website</a><button class="btn out sm" id="signout">Sign out</button></div>
    </div>

    <div class="tabs"><button type="button" class="tab active" data-t="details">Website details</button><button type="button" class="tab" data-t="videos">Videos</button></div>

    <div class="card c1" id="sec-details">
      <h2>Website details</h2>
      <p class="sub">These change your homepage as soon as you press Save.</p>
      <form id="settings">
        <div class="grid">
          <label>Website name<input id="siteName" placeholder="Deshmukh Gamer"></label>
          <label>Instagram username (without @)<input id="instagram" placeholder="deshmukh_gamer"></label>
        </div>
        <label>Intro text on homepage<textarea id="intro" rows="3"></textarea></label>
        <div class="grid">
          <label>Contact email shown on website<input id="email" type="email" placeholder="you@gmail.com"></label>
          <label>Web3Forms access key (for contact form)<input id="wkey" placeholder="paste key here" autocomplete="off"></label>
        </div>
        <button class="btn" type="submit">Save changes</button>
      </form>
    </div>

    <div class="card c2" id="sec-videos" hidden>
      <div class="top" style="margin-bottom:.4rem">
        <div><h2>Video boxes</h2><p class="sub" style="margin:.2rem 0 0">Each box is one video on your website. Paste its YouTube link inside the box.</p></div>
        <button class="btn out sm" type="button" id="addbox">+ Add video box</button>
      </div>
      <div id="boxes"><p class="sub">Loading…</p></div>
      <button class="btn" type="button" id="saveall" style="margin-top:.6rem">Save all videos</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== SETTINGS: paste your Firebase config here ===== */
var FIREBASE_CONFIG={apiKey:'AIzaSyBWaWVw0f9AcBgxKr6G1UzqGij1xBJ3p5A',authDomain:'editing-portfolio-2dbc9.firebaseapp.com',projectId:'editing-portfolio-2dbc9',appId:'1:292518658373:web:c57ce6aeb07f136378fe2c'};
var ADMIN_EMAIL='deshmukhgangadhar15@gmail.com';

var $=function(i){return document.getElementById(i)};
var auth,db;
function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(function(){e.className='toast'},3200)}

if(!FIREBASE_CONFIG.apiKey){$('lmsg').textContent='Firebase is not set up yet. Paste your Firebase config in this file first.'}
else{
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();db=firebase.firestore();
  $('signin').onclick=function(){
    var p=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch(function(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){auth.signInWithRedirect(p)}
      else $('lmsg').textContent=e.message;
    });
  };
  $('signout').onclick=function(){auth.signOut()};
  auth.onAuthStateChanged(function(u){
    if(u&&u.email===ADMIN_EMAIL){$('login').hidden=true;$('panel').hidden=false;$('who').textContent='Signed in as '+u.email;loadVideos();loadSettings()}
    else if(u){$('lmsg').textContent='This account is not allowed: '+u.email;auth.signOut()}
    else{$('login').hidden=false;$('panel').hidden=true}
  });
}

function loadSettings(){
  db.collection('settings').doc('site').get().then(function(s){
    var d=s.exists?s.data():{};
    $('siteName').value=d.siteName||'';$('instagram').value=d.instagram||'';$('intro').value=d.intro||'';$('email').value=d.email||'';$('wkey').value=d.web3forms_key||'';
  }).catch(function(e){toast('Could not load settings: '+e.message,1)});
}
$('settings').onsubmit=function(e){
  e.preventDefault();
  db.collection('settings').doc('site').set({
    siteName:$('siteName').value.trim(),instagram:$('instagram').value.trim().replace(/^@/,''),intro:$('intro').value.trim(),
    email:$('email').value.trim(),web3forms_key:$('wkey').value.trim()
  }).then(function(){toast('✓ Saved. Your website is updated.')}).catch(function(er){toast('Could not save: '+er.message,1)});
};

function showTab(t){['details','videos'].forEach(function(n){$('sec-'+n).hidden=n!==t});document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.t===t)})}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){showTab(b.dataset.t)}});
var boxes=[],removed=[];
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function renderBoxes(){
  var c=$('boxes');c.innerHTML='';
  if(!boxes.length){c.innerHTML='<p class="sub">No video boxes yet. Press "+ Add video box".</p>';return}
  boxes.forEach(function(v,i){
    var d=document.createElement('div');d.className='vbox';
    d.innerHTML='<div class="vh"><b>Video '+(i+1)+'</b><button type="button" class="btn del sm">Delete this box</button></div>'+
    '<label>YouTube link for Video '+(i+1)+'<input data-k="url" type="url" value="'+esc(v.url)+'" placeholder="https://www.youtube.com/watch?v=..."></label>'+
    '<div class="grid"><label>Title (optional)<input data-k="title" value="'+esc(v.title)+'" placeholder="Video '+(i+1)+'"></label>'+
    '<label>Category<select data-k="category"><option value="gaming">Gaming</option><option value="youtube">YouTube</option><option value="reels">Reels</option></select></label></div>'+
    '<label>Short description (optional)<textarea data-k="description" rows="2">'+esc(v.description)+'</textarea></label>';
    d.querySelector('select').value=v.category||'gaming';
    d.querySelectorAll('[data-k]').forEach(function(el){el.oninput=el.onchange=function(){v[el.dataset.k]=el.value}});
    d.querySelector('.del').onclick=function(){
      if(!confirm('Delete Video '+(i+1)+'? It is removed from the website after you press Save all videos.'))return;
      if(v.id)removed.push(v.id);boxes.splice(i,1);renderBoxes();
    };
    c.appendChild(d);
  });
}
function loadVideos(){
  db.collection('videos').orderBy('createdAt','asc').get().then(function(s){
    boxes=[];removed=[];
    s.forEach(function(d){var v=d.data();boxes.push({id:d.id,title:v.title||'',url:v.url||'',category:v.category||'gaming',description:v.description||''})});
    renderBoxes();
  }).catch(function(e){$('boxes').textContent='Could not load: '+e.message});
}
$('addbox').onclick=function(){boxes.push({title:'',url:'',category:'gaming',description:''});renderBoxes();var l=$('boxes').lastChild;if(l)l.scrollIntoView({behavior:'smooth',block:'center'})};
$('saveall').onclick=function(){
  for(var k=0;k<boxes.length;k++){
    var u=(boxes[k].url||'').trim();
    if(!/^https?:\/\//.test(u)){toast('Video '+(k+1)+': enter the full YouTube link.',1);return}
  }
  var btn=$('saveall');btn.disabled=true;
  var ops=[];
  removed.forEach(function(id){ops.push(db.collection('videos').doc(id).delete())});
  boxes.forEach(function(v,i){
    var data={title:(v.title||'').trim()||('Video '+(i+1)),url:v.url.trim(),category:v.category,description:(v.description||'').trim(),createdAt:firebase.firestore.Timestamp.fromMillis(Date.now()+i)};
    ops.push(v.id?db.collection('videos').doc(v.id).set(data):db.collection('videos').add(data));
  });
  Promise.all(ops).then(function(){btn.disabled=false;toast('\u2713 Saved. Your website is updated.');loadVideos()})
  .catch(function(er){btn.disabled=false;toast('Could not save: '+er.message,1)});
};
</script>
</body>
</html>
